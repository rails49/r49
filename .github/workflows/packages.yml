# The format's packages: build them, typecheck them, and run their tests and
# every conformance case under conformance/cases/. The toolchain comes from
# the root package.json (packageManager) and .nvmrc, never restated here.
name: packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # @rails49/r49's TypeScript tests and the conformance cases, which its
      # runner walks.
      - run: pnpm test

  # rails49-r49, the Python reader: its lint and types, its tests and every
  # conformance case, which its runner walks. uv.lock pins the toolchain.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/r49-py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pyright
      - run: uv run pytest
