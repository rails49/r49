# The gate, ./scripts/check.sh. The toolchain is the root package.json's
# packageManager, .nvmrc and the uv version below.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.6"

      - run: ./scripts/check.sh
