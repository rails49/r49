# A pushed tag vX.Y.Z publishes @rails49/r49 to npm and rails49-r49 to PyPI
# through trusted publishing, then makes a GitHub Release. The steps a person
# takes are in docs/releasing.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release

jobs:
  # Builds the files once, runs the conformance cases against them as
  # installed, and hands those same files to the publish jobs.
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check that the tag is on main needs main present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$GITHUB_REF_NAME is not vX.Y.Z; nothing is published" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main; nothing is published" >&2
            exit 1
          fi
          version=$(./scripts/version.sh)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME does not match the packages' version $version; nothing is published" >&2
            exit 1
          fi

      # The toolchain is the root package.json's `packageManager`, .nvmrc and
      # ci.yml's uv version.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.6"

      - name: Build and check the packages
        run: |
          pnpm install --frozen-lockfile --filter "@rails49/r49..."
          pnpm --filter @rails49/r49 build
          ./scripts/check-packages.sh "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  # A failed publish is fixed by re-running its job; the files do not change.
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with 10.
      - run: npm install -g npm@11.21.0

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - run: npm publish "$RUNNER_TEMP"/packages/npm/*.tgz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/packages/pypi

  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
