# The submission gate. FORMAT.md § Corpus rules decides what it asserts
# (rails49/occupancy#57), rails49/occupancy#62 what it looks like;
# `tools/r49-validate` does the deciding, and everything here is rendering.
#
# Two jobs, because they answer to different things:
#
# * `archives` judges what this pull request submitted. Pull requests only —
#   there is no base to diff against otherwise.
# * `guidance` judges whether CONTRIBUTING.md's generated capture table still
#   matches the arithmetic it came from: the recommended DPT and the scale
#   table in packages/r49/src/data.json. It runs on every pull request, not
#   only ones carrying a `.r49`, because a change to data.json is a pull
#   request that need not touch CONTRIBUTING.md.
#
# The validator is this repository's own, built on @rails49/r49 in the same
# workspace, so nothing here checks out another repository.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  # The guidance check can go stale with no commit here at all. This is how a
  # maintainer confirms it without inventing a pull request.
  workflow_dispatch:

# Every contributor pull request is a fork pull request, where `GITHUB_TOKEN` is
# read-only anyway. Stating it makes that a choice rather than an accident:
# `::warning` annotations and `$GITHUB_STEP_SUMMARY` need no token at all, which
# is why rails49#57 chose them over a bot comment.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  archives:
    name: archives
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: the changed-file diff, and the validator reading the
      # corpus as it was before this pull request, need the base commit present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The toolchain is the root package.json's `packageManager` and `.nvmrc`,
      # never restated here.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The validator and @rails49/r49, which it is built on.
      - name: Build the validator
        run: |
          pnpm install --frozen-lockfile --filter "@rails49/r49-validate..."
          pnpm --filter "@rails49/r49-validate..." build

      # NUL-delimited, and never split on whitespace. A filename with a space in
      # it is precisely what the slug rule exists to reject — so it has to reach
      # the validator intact in order to be rejected by name, rather than
      # arriving as two paths that do not exist.
      #
      # Only the corpus, as `r49-validate list` names it. The cases under
      # conformance/ break format rules on purpose and are not submissions.
      - name: Find the archives this pull request changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --diff-filter=ACMR -z --name-only "$BASE" HEAD \
            | xargs -0 -r node tools/r49-validate/dist/cli.js list \
            > "$RUNNER_TEMP/changed.nul"
          # `tr -d ' '` because wc pads its count on some platforms, and the
          # step that reads this output compares it against the string "0".
          count=$(tr -cd '\0' < "$RUNNER_TEMP/changed.nul" | wc -c | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count archive(s) changed."

      - name: No archives changed
        if: steps.changed.outputs.count == '0'
        run: |
          {
            echo "## Archives"
            echo
            echo "This pull request changes no \`.r49\` files, so there was nothing to validate."
          } >> "$GITHUB_STEP_SUMMARY"

      # stdout is the machine rendering and stderr the human one — one code path
      # produces both, so the annotations and the log cannot disagree about what
      # was found. `--author` comes through the environment rather than through
      # `${{ }}` interpolation, so a handle is never pasted into a shell.
      # `--base` is the corpus before this pull request, which tells an update
      # from a new archive and says what the update changed.
      - name: Validate
        id: validate
        if: steps.changed.outputs.count != '0'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          paths=()
          while IFS= read -r -d '' path; do paths+=("$path"); done \
            < "$RUNNER_TEMP/changed.nul"
          printf 'validating %s\n' "${paths[@]}"

          set +e
          node tools/r49-validate/dist/cli.js --author "$AUTHOR" --base "$BASE" -- "${paths[@]}" \
            > "$RUNNER_TEMP/report.json" 2> "$RUNNER_TEMP/report.txt"
          status=$?
          set -e

          cat "$RUNNER_TEMP/report.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # 2 is the tool failing, never an archive being rejected. Nothing was
          # judged, so there is no report to render and no annotation to hang on
          # a contributor's file.
          if [ "$status" -eq 2 ]; then
            {
              echo "## Archives"
              echo
              echo "**The validator itself failed — this is not about your submission.**"
              echo "Please tell a maintainer; the log has the stack trace."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      # GitHub shows at most ten annotations per level per step, so the summary
      # below — which lists every finding — is the complete record and this is
      # the convenient one. Message text is escaped per the workflow-command
      # rules: `%` first, then the line breaks.
      - name: Annotate the findings
        if: always() && steps.validate.outputs.status != '' && steps.validate.outputs.status != '2'
        run: |
          jq -r '
            def esc: gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");
            .archives[] | .path as $p |
              (.errors[]   | "::error file=\($p),title=r49-validate::\(.message | esc)"),
              (.warnings[] | "::warning file=\($p),title=r49-validate::\(.message | esc)")
          ' "$RUNNER_TEMP/report.json"

      # The fact table rails49/occupancy#57 asks for: id, DPT, residual, counts — read by
      # a maintainer deciding whether to accept, and deliberately carrying no
      # grade. The residual is reported and never thresholded; no calibrated
      # threshold exists, and inventing one here would put a number into the
      # pipeline that nothing earned.
      #
      # The change column is the validator's: an update is recognised by its id,
      # so a moved archive is an update, not a new one.
      - name: Summarise
        if: always() && steps.validate.outputs.status != '' && steps.validate.outputs.status != '2'
        run: |
          {
            echo "## Archives"
            echo
            echo "| Archive | Change | Scope | id | DPT | Residual px | Images | Labels | Complete | Errors | Warnings |"
            echo "| :--- | :--- | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            jq -r '
              def dash: if . == null then "—" else tostring end;
              def change:
                if . == null then "—"
                elif .kind == "new" then "new"
                else . as $c | [
                  (if $c.added > 0 then "\($c.added) added" else empty end),
                  (if $c.removed > 0 then "\($c.removed) removed" else empty end),
                  (if $c.renamed > 0 then "\($c.renamed) renamed" else empty end),
                  (if $c.replaced > 0 then "\($c.replaced) replaced" else empty end),
                  (if $c.relabeled > 0 then "\($c.relabeled) relabeled" else empty end),
                  (if $c.completed > 0 then "\($c.completed) newly complete" else empty end),
                  (if $c.uncompleted > 0 then "\($c.uncompleted) no longer complete" else empty end),
                  (if $c.calibration then "calibration changed" else empty end)
                ] | "update of `\($c.from)`" + (if length == 0 then "" else ": " + join(", ") end)
                end;
              def round1: if . == null then "—" else ((. * 10 | round) / 10 | tostring) end;
              .archives[] | .path as $p |
              "| `\($p)` | \(.change | change) | \(.scope)"
              + " | `\(.id | dash)` | \(.dpt | round1) | \(.dptResidual | round1)"
              + " | \(.images | dash) | \(.labels | dash) | \(.complete | dash)/\(.images | dash)"
              + " | \(.errors | length) | \(.warnings | length) |"
            ' "$RUNNER_TEMP/report.json"
            echo

            findings=$(jq -r '
              .archives[] | .path as $p |
                (.errors[]   | "- ❌ `\($p)` — \(.message)"),
                (.warnings[] | "- ⚠️ `\($p)` — \(.message)")
            ' "$RUNNER_TEMP/report.json")

            if [ -n "$findings" ]; then
              echo "### Findings"
              echo
              echo "$findings"
              echo
              echo "❌ blocks the merge. ⚠️ does not — it is a quality signal for the maintainer to read."
            fi

            echo
            echo "Warnings never fail this check. The bar CI cannot set is whether the boxes"
            echo "actually land on the cars; see CONTRIBUTING.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block on errors
        if: always() && steps.validate.outputs.status == '1'
        run: |
          echo "At least one archive carries a blocking error; see the findings above." >&2
          exit 1

  guidance:
    name: capture guidance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build the validator
        run: |
          pnpm install --frozen-lockfile --filter "@rails49/r49-validate..."
          pnpm --filter "@rails49/r49-validate..." build

      # The comparison and its wording live in the validator, where `pnpm test`
      # covers them — not in this file, which nothing covers. The wording is the
      # deliverable: the usual cause of a failure here is a change to data.json,
      # a file the contributor reading the message has never touched.
      - name: Check CONTRIBUTING.md against the arithmetic it came from
        run: |
          set +e
          node tools/r49-validate/dist/cli.js guidance --check CONTRIBUTING.md \
            2> "$RUNNER_TEMP/guidance.txt"
          status=$?
          set -e

          cat "$RUNNER_TEMP/guidance.txt"

          if [ "$status" -eq 0 ]; then
            {
              echo "## Capture guidance"
              echo
              echo "✅ \`CONTRIBUTING.md\` matches \`r49-validate guidance\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Capture guidance"
            echo
            if [ "$status" -eq 2 ]; then
              echo "**The check itself failed — this is not about your submission.**"
              echo "Please tell a maintainer."
            fi
            echo '```'
            cat "$RUNNER_TEMP/guidance.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # One annotation on the file, carrying the whole message. `%` first,
          # then every newline, per the workflow-command escaping rules.
          message=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/guidance.txt" \
            | awk '{ printf "%s%%0A", $0 }')
          echo "::error file=CONTRIBUTING.md,title=Capture guidance is out of date::$message"

          exit "$status"
