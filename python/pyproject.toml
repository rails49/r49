[project]
name = "rails49-r49"
version = "0.1.0"
description = "Read and validate .r49 model railroad layout archives, and compute their calibration fit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://github.com/rails49/r49"
Format = "https://github.com/rails49/r49/blob/main/FORMAT.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "black>=24", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r49"]

# src/r49/r49.json is a symlink to the repository's data/r49.json, the one
# authored copy. An sdist carries the file itself, which the wheel then packs.
[tool.hatch.build.targets.sdist]
exclude = ["src/r49/r49.json"]

[tool.hatch.build.targets.sdist.force-include]
"../data/r49.json" = "src/r49/r49.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
